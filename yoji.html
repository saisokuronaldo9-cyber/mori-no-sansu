<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#76c8f4">
<title>はたらくくるまの まち</title>
<meta name="description" content="3歳ごろから遊べる、音声つきの働く車ことば遊び">
<style>
:root{--navy:#173e55;--blue:#39a9e8;--yellow:#ffd64d;--cream:#fffaf0;--green:#57b86b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--navy);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;background:linear-gradient(#83d4fa 0 190px,#dff3c6 190px 100%)}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:5px solid #ff9c39;outline-offset:3px}main{width:min(100%,900px);margin:auto;padding:0 18px 36px}.top{min-height:110px;display:flex;align-items:center;justify-content:space-between;color:white;text-shadow:0 2px #2074a2}.top h1{font-size:clamp(25px,5vw,42px);margin:0;line-height:1.2}.top p{margin:4px 0 0;font-weight:900}.sound{width:62px;height:62px;border:0;border-radius:50%;background:white;color:var(--navy);font-size:29px;box-shadow:0 6px 0 #2789be;cursor:pointer}.road{height:58px;margin:0 -18px 14px;background:#59656c;border-block:6px solid #e8e4d7;position:relative}.road:after{content:"";position:absolute;left:0;right:0;top:21px;border-top:6px dashed white}.road span{position:absolute;z-index:1;left:9%;top:-25px;font-size:58px;animation:drive 8s linear infinite}@keyframes drive{to{left:82%}}nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}nav button,.collection-tabs button{min-height:57px;border:0;border-radius:18px;background:#ffffffcc;color:#5c7380;font-size:18px;font-weight:900;cursor:pointer}nav button.active,.collection-tabs button.active{background:var(--yellow);color:var(--navy);box-shadow:0 5px 0 #d7a928}.card{background:var(--cream);border:4px solid white;border-radius:28px;padding:22px;box-shadow:0 12px 0 #77a55f55}.status{display:flex;justify-content:space-between;gap:10px;font-weight:900}.pill{background:white;border-radius:20px;padding:8px 13px}.progress{height:18px;margin:13px 0 18px;border-radius:20px;background:#e4e7dc;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb536,#ffe75e);transition:.35s}.question{text-align:center}.question .kind{margin:0;color:#547384;font-weight:900}.question h2{margin:8px 0 5px;font-size:clamp(27px,6vw,43px);line-height:1.35}.listen{min-height:52px;padding:9px 20px;border:0;border-radius:18px;background:#e2f3fc;color:#245c78;font-size:18px;font-weight:900;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:20px}.choice{--c:#f5c344;min-width:0;min-height:190px;border:4px solid #dce4dd;border-bottom-width:9px;border-radius:24px;background:white;padding:12px 6px;color:var(--navy);font-weight:900;cursor:pointer}.choice .vehicle{display:grid;place-items:center;width:100%;height:112px;border-radius:19px;background:linear-gradient(145deg,color-mix(in srgb,var(--c),white 72%),white);font-size:72px}.choice span:last-child{display:block;margin-top:8px;font-size:18px}.choice.correct{background:#e5f8d5;border-color:#65bd55;animation:pop .4s}.choice.wrong{background:#ffe4df;border-color:#ef7564;animation:shake .35s}.message{min-height:38px;margin:15px 0 0;text-align:center;font-size:21px;font-weight:900;color:#318753}.message.bad{color:#d25f4d}.reward-note{text-align:center;margin:13px 0 0;color:#62766d;font-weight:800}.collection-tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}.garage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.garage-head h2{margin:0;font-size:30px}.garage-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.garage-car{--c:#f5c344;min-width:0;min-height:210px;border:3px solid #dce4dd;border-radius:22px;background:white;padding:13px 7px;text-align:center;cursor:pointer}.garage-car .vehicle{display:grid;place-items:center;height:112px;border-radius:18px;background:linear-gradient(145deg,color-mix(in srgb,var(--c),white 70%),white);font-size:70px}.garage-car h3{margin:8px 0 4px;font-size:18px}.garage-car p{margin:0;color:#6a7b74;font-size:13px;font-weight:800}.garage-car.locked{filter:grayscale(1);opacity:.55}.garage-car.locked .vehicle{font-size:0}.garage-car.locked .vehicle:after{content:"？";font-size:55px}.empty{grid-column:1/-1;text-align:center;padding:35px 10px;font-size:19px;font-weight:900}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#173e55dd}.modal[hidden]{display:none}.welcome,.reward{width:min(92vw,440px);border:6px solid white;border-radius:32px;background:#fffaf0;padding:28px;text-align:center;box-shadow:0 18px 0 #112e3f}.welcome .big,.reward .big{font-size:92px;display:block}.welcome h2,.reward h2{font-size:31px;margin:4px 0 8px}.welcome p,.reward p{font-size:17px;line-height:1.7;font-weight:800}.start,.closeReward{width:100%;min-height:66px;border:0;border-bottom:7px solid #2377a3;border-radius:20px;background:var(--blue);color:white;font-size:25px;font-weight:900;cursor:pointer}.reward .closeReward{background:var(--green);border-color:#36864a}.confetti{animation:pop .7s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{50%{transform:scale(1.09)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}footer{text-align:center;padding:18px 0 0;color:#57705d;font-size:12px;font-weight:800}@media(max-width:620px){main{padding-inline:10px}.card{padding:15px 10px}.choices{gap:7px}.choice{min-height:164px}.choice .vehicle{height:96px;font-size:60px}.choice span:last-child{font-size:15px}.garage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.road{margin-inline:-10px}}@media(max-width:390px){.top h1{font-size:24px}.choice{padding-inline:3px}.choice .vehicle{font-size:52px}.question h2{font-size:27px}}
</style>
</head>
<body>
<main>
 <header class="top"><div><h1>🚧 はたらくくるまの まち</h1><p>きいて・みて・さわって あそぼう！</p></div><button id="soundButton" class="sound" aria-label="音声をオン・オフ">🔊</button></header>
 <div class="road"><span>🚚</span></div>
 <nav><button id="playTab" class="active">▶️ あそぶ</button><button id="garageTab">🏠 くるまの しゃこ</button></nav>
 <section id="play" class="card">
  <div class="status"><span class="pill">⭐ <b id="correctCount">0</b> / 5</span><span class="pill">🔩 ぶひん <b id="parts">0</b> / 3</span></div>
  <div class="progress"><i id="progress"></i></div>
  <div class="question"><p id="kind" class="kind">なまえを きこう</p><h2 id="questionText">しょうぼうしゃは どれ？</h2><button id="listen" class="listen">🔊 もういちど きく</button></div>
  <div id="choices" class="choices"></div>
  <p id="message" class="message" aria-live="polite">えを さわってね！</p>
  <p class="reward-note">5もん できたら ぶひんを ゲット！<br>ぶひん3こで あたらしい くるまが できるよ</p>
 </section>
 <section id="garage" class="card" hidden>
  <div class="garage-head"><h2>🏠 くるまの しゃこ</h2><span class="pill"><b id="ownedCount">0</b> / 12</span></div>
  <p class="reward-note">くるまを さわると、なまえと おしごとを おはなしするよ</p>
  <div id="garageGrid" class="garage-grid"></div>
 </section>
 <footer>このタブレットに きろくを ほぞんします</footer>
</main>
<div id="welcome" class="modal"><div class="welcome"><span class="big">🚜</span><h2>はたらくくるまの まち</h2><p>おとが でるよ。<br>おおきな あおいボタンを おしてね！</p><button id="start" class="start">▶️ はじめる</button></div></div>
<div id="rewardModal" class="modal" hidden><div class="reward"><span id="rewardIcon" class="big confetti">🔩</span><h2 id="rewardTitle">ぶひんを ゲット！</h2><p id="rewardText">あと2こで くるまが できるよ！</p><button id="closeReward" class="closeReward">つぎも あそぶ</button></div></div>
<script>
const vehicles=[
 {name:"ショベルカー",icon:"🚜",job:"つちを ほる",color:"#f5c344",colorName:"きいろ"},
 {name:"しょうぼうしゃ",icon:"🚒",job:"ひを けす",color:"#ef5b50",colorName:"あか"},
 {name:"きゅうきゅうしゃ",icon:"🚑",job:"けがを した ひとを はこぶ",color:"#f5f5f0",colorName:"しろ"},
 {name:"パトカー",icon:"🚓",job:"まちの あんぜんを まもる",color:"#74a9d8",colorName:"あお"},
 {name:"ダンプカー",icon:"🚚",job:"つちや いしを はこぶ",color:"#e89a3f",colorName:"オレンジ"},
 {name:"クレーンしゃ",icon:"🏗️",job:"おもいものを もちあげる",color:"#f0cf42",colorName:"きいろ"},
 {name:"ごみしゅうしゅうしゃ",icon:"🚛",job:"ごみを あつめる",color:"#66b86b",colorName:"みどり"},
 {name:"トラクター",icon:"🚜",job:"はたけを たがやす",color:"#65a85d",colorName:"みどり"},
 {name:"ミキサーしゃ",icon:"🚚",job:"コンクリートを まぜる",color:"#75b8d8",colorName:"あお"},
 {name:"フォークリフト",icon:"🏗️",job:"にもつを もちあげる",color:"#ef9e39",colorName:"オレンジ"},
 {name:"ろせんバス",icon:"🚌",job:"たくさんの ひとを のせる",color:"#56b884",colorName:"みどり"},
 {name:"タクシー",icon:"🚕",job:"ひとを いきたい ばしょへ はこぶ",color:"#f2c93e",colorName:"きいろ"}
];
const key="hataraku-kuruma-3-v1";let save={correct:0,parts:0,owned:[]};try{save={...save,...JSON.parse(localStorage.getItem(key)||"{}")} }catch(e){}if(!Array.isArray(save.owned))save.owned=[];
let soundOn=true,current=null,busy=false,lastTarget=-1;const $=id=>document.getElementById(id);function store(){localStorage.setItem(key,JSON.stringify(save))}
function speak(text){if(!soundOn||!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=.82;u.pitch=1.15;let voices=speechSynthesis.getVoices(),jp=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ja"));if(jp)u.voice=jp;speechSynthesis.speak(u)}
function sampleOptions(target,type){let ids=[target],usedColors=new Set([vehicles[target].colorName]);while(ids.length<3){let n=Math.floor(Math.random()*vehicles.length);if(ids.includes(n)||type==="color"&&usedColors.has(vehicles[n].colorName))continue;ids.push(n);usedColors.add(vehicles[n].colorName)}return ids.sort(()=>Math.random()-.5)}
function makeQuestion(){let target;do{target=Math.floor(Math.random()*vehicles.length)}while(target===lastTarget);lastTarget=target;let type=["name","job","color"][Math.floor(Math.random()*3)],v=vehicles[target],text,kind;if(type==="name"){text=v.name+"は どれ？";kind="くるまの なまえ"}else if(type==="job"){text=v.job+" くるまは どれ？";kind="くるまの おしごと"}else{text=v.colorName+"の くるまは どれ？";kind="いろを みつけよう"}return{target,type,text,kind,options:sampleOptions(target,type)}}
function renderQuestion(){current=makeQuestion();busy=false;$("kind").textContent=current.kind;$("questionText").textContent=current.text;$("message").className="message";$("message").textContent="えを さわってね！";$("choices").innerHTML=current.options.map(i=>{let v=vehicles[i];return`<button class="choice" data-i="${i}" style="--c:${v.color}" aria-label="${v.name}"><span class="vehicle">${v.icon}</span><span>${v.name}</span></button>`}).join("");document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.i));setTimeout(()=>speak(current.text),250)}
function answer(i){if(busy)return;let button=document.querySelector(`.choice[data-i="${i}"]`);if(i!==current.target){button.classList.add("wrong");$("message").className="message bad";$("message").textContent="もういちど さわってみよう！";speak("おしい。もういちど、さわってみよう");setTimeout(()=>{button.classList.remove("wrong");speak(current.text)},1000);return}busy=true;button.classList.add("correct");save.correct++;$("message").textContent="せいかい！ やったね！";speak("せいかい。やったね");if(save.correct>=5){save.correct=0;save.parts++;let completed=null;if(save.parts>=3){save.parts=0;completed=vehicles.findIndex((_,n)=>!save.owned.includes(n));if(completed>=0)save.owned.push(completed)}store();update();setTimeout(()=>showReward(completed),900)}else{store();update();setTimeout(renderQuestion,1300)}}
function showReward(completed){if(completed!==null&&completed>=0){let v=vehicles[completed];$("rewardIcon").textContent=v.icon;$("rewardTitle").textContent=v.name+"が できた！";$("rewardText").textContent="しゃこで みてみよう！";speak(v.name+"が、できたよ")}else{$("rewardIcon").textContent="🔩";$("rewardTitle").textContent="ぶひんを ゲット！";$("rewardText").textContent="あと "+(3-save.parts)+"こで、あたらしい くるまが できるよ！";speak("ぶひんを、ゲット。あと"+(3-save.parts)+"こだよ")}$("rewardModal").hidden=false}
function update(){$("correctCount").textContent=save.correct;$("parts").textContent=save.parts;$("progress").style.width=(save.correct/5*100)+"%";$("ownedCount").textContent=save.owned.length;$("garageGrid").innerHTML=vehicles.map((v,i)=>{let on=save.owned.includes(i);return`<button class="garage-car ${on?"":"locked"}" data-i="${i}" style="--c:${v.color}" aria-label="${on?v.name:"まだ できていない くるま"}"><span class="vehicle">${on?v.icon:""}</span><h3>${on?v.name:"？？？"}</h3><p>${on?v.job:"ぶひんを あつめよう"}</p></button>`}).join("");document.querySelectorAll(".garage-car").forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(save.owned.includes(i))speak(vehicles[i].name+"。"+vehicles[i].job+"、くるまだよ");else speak("まだ、できていない、くるまだよ")})}
function showPlay(){$("play").hidden=false;$("garage").hidden=true;$("playTab").classList.add("active");$("garageTab").classList.remove("active")}function showGarage(){$("play").hidden=true;$("garage").hidden=false;$("garageTab").classList.add("active");$("playTab").classList.remove("active");update();speak("くるまの、しゃこ")}
$("start").onclick=()=>{$("welcome").hidden=true;speak("はたらくくるまの、まちへ、ようこそ");setTimeout(renderQuestion,900)};$("soundButton").onclick=()=>{soundOn=!soundOn;$("soundButton").textContent=soundOn?"🔊":"🔇";if(!soundOn&&"speechSynthesis" in window)speechSynthesis.cancel();else speak("おとが、でるよ")};$("listen").onclick=()=>speak(current?current.text:"くるまを、さわってね");$("playTab").onclick=showPlay;$("garageTab").onclick=showGarage;$("closeReward").onclick=()=>{$("rewardModal").hidden=true;renderQuestion()};update();
</script>
</body>
</html>
