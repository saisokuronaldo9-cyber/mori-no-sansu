<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dff3d2">
  <title>もりの さんすう</title>
  <meta name="description" content="小学1年生向けの、なかまを育てる計算練習アプリ">
  <style>
    :root{--ink:#233b31;--green:#2d7653;--lime:#d9ef7e}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;background:radial-gradient(circle at 10% 10%,#fff9 0 4%,transparent 5%),linear-gradient(180deg,#dff3d2 0,#f7f5df 32%,#fffdf6 100%);min-height:100vh}
    button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}main{width:min(100%,900px);margin:auto;padding:0 24px 32px}
    header{height:74px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--green)}.score{background:white;border:2px solid #d6e4c7;box-shadow:0 4px 0 #cbdab9;border-radius:22px;padding:8px 18px;font-size:20px}
    .hero{min-height:180px;display:flex;align-items:center;justify-content:space-between}.eyebrow{margin:0 0 8px;color:#5c755c;font-weight:800;font-size:14px}.hero h1{margin:0;font-size:clamp(30px,5vw,48px);line-height:1.25}.hero h1 span{color:var(--green);background:linear-gradient(transparent 64%,var(--lime) 64%)}
    .friends{display:flex;align-items:end;gap:8px;padding:35px 10px 0}.sprite{--c:#f66;position:relative;width:66px;height:80px;border-radius:48%;background:var(--c);box-shadow:inset -7px -5px #0001,0 6px 0 #0001}.sprite:nth-child(2){transform:scale(.85)}.sprite:nth-child(3){transform:scale(.93)}.sprite b{position:absolute;top:-38px;left:17px;font-size:30px}.sprite:before,.sprite:after{content:"";position:absolute;top:29px;width:8px;height:11px;background:#28372e;border-radius:50%}.sprite:before{left:17px}.sprite:after{right:17px}
    nav{display:flex;gap:10px;margin-bottom:12px}nav button{border:0;background:#fff9;color:#627368;border-radius:18px 18px 0 0;padding:14px 25px;font-weight:900;cursor:pointer}nav button.active{background:white;color:var(--green);box-shadow:0 -3px 0 var(--green) inset}
    .card{background:#fff;border:1px solid #e5e7d7;box-shadow:0 14px 40px #40643c18;border-radius:0 26px 26px 26px;padding:28px}.row{display:flex;justify-content:space-between;color:#657568;font-size:14px;font-weight:800}.bar{height:11px;background:#edf0e4;border-radius:20px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#88c957,#d5e94d);border-radius:20px;transition:.3s}.streak{text-align:center;min-height:24px;margin:20px 0 5px;color:#dd7841;font-weight:900}
    .problem{display:flex;justify-content:center;align-items:center;gap:clamp(16px,5vw,42px);font-size:clamp(48px,10vw,76px);font-weight:900}.problem em{font-size:.72em;color:#79907c;font-style:normal}.problem .mystery{color:var(--green);background:#edf6d7;border-radius:22px;width:1.25em;text-align:center}.message{text-align:center;font-weight:900;color:#4c7a54;height:25px;margin:14px 0}.message.wrong{color:#bb654d}
    .answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:600px;margin:auto}.answers button{min-height:88px;border:3px solid #dce5d3;border-bottom-width:7px;border-radius:20px;background:#fff;color:var(--ink);font-size:42px;font-weight:900;cursor:pointer}.answers button:active{transform:translateY(4px);border-bottom-width:3px}.answers button.correct{background:#dff3c6;border-color:#68af4b;color:#28713f}.answers button.wrong{background:#ffe3da;border-color:#e67c67}.note{margin:22px 0 0;text-align:center;color:#6d796d;font-size:14px;background:#f7f8ee;padding:11px;border-radius:12px}
    .garden-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.garden-head h2{margin:0;font-size:30px}.garden-head>span{background:#ecf5da;padding:8px 14px;border-radius:20px;font-weight:900;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pal{text-align:center;background:#f9faef;border:2px solid #e7e9d9;border-radius:20px;padding:18px 8px}.pal.locked{filter:saturate(.3);opacity:.72}.face{--c:#f66;width:74px;height:80px;margin:8px auto 12px;background:var(--c);border-radius:48%;position:relative;box-shadow:inset -8px -5px #0001;display:grid;place-items:start center}.face b{font-size:29px;transform:translateY(-20px)}.face:before,.face:after{content:"";position:absolute;top:31px;width:8px;height:11px;background:#26352b;border-radius:50%}.face:before{left:20px}.face:after{right:20px}.pal h3{margin:0;font-size:16px}.pal p{margin:6px 0;color:#718073;font-size:12px;min-height:18px}.levels{display:flex;gap:4px;justify-content:center}.levels i{width:18px;height:5px;border-radius:5px;background:#daddd1}.levels i.on{background:#75b651}
    footer{display:flex;justify-content:space-between;padding:18px 6px 0;color:#718074;font-size:12px;font-weight:700}
    @media(max-width:650px){main{padding:0 14px 24px}header{height:64px}.brand{font-size:17px}.score{padding:6px 13px}.hero{min-height:145px}.friends{transform:scale(.75);transform-origin:right center;margin-left:-45px}.hero h1{font-size:27px}nav button{padding:12px 15px;font-size:14px}.card{padding:20px 14px;border-radius:0 20px 20px 20px}.problem{gap:15px;font-size:50px}.answers{gap:9px}.answers button{min-height:76px;font-size:36px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.friends{display:none}.hero{min-height:135px}.problem{font-size:44px}}
  </style>
</head>
<body>
<main>
  <header><div class="brand"><span class="mark">🌱</span>もりの さんすう</div><div class="score">🌰 <strong id="seeds">0</strong></div></header>
  <section class="hero"><div><p class="eyebrow">まいにち 5もんで すくすく！</p><h1>けいさんして、<br><span>もりの なかま</span>を そだてよう</h1></div><div class="friends"><i class="sprite" style="--c:#ff665f"><b>🌱</b></i><i class="sprite" style="--c:#f6c945"><b>🌼</b></i><i class="sprite" style="--c:#55aee8"><b>💧</b></i></div></section>
  <nav><button id="playTab" class="active">✏️ けいさん</button><button id="gardenTab">🌿 なかまの もり</button></nav>
  <section id="play" class="card">
    <div class="row"><span>きょうの ぼうけん</span><strong><span id="today">0</span> / 5 もん</strong></div><div class="bar"><i id="progress" style="width:0"></i></div>
    <div id="streak" class="streak">ゆっくり かんがえてね</div><div class="problem"><span id="a">3</span><em id="sign">+</em><span id="b">2</span><em>=</em><span class="mystery">?</span></div>
    <p id="message" class="message" aria-live="polite">こたえを えらんでね</p><div id="answers" class="answers"></div>
    <p class="note">🌰 タネを あと <strong id="needed">5</strong>こ あつめると なかまが そだつよ</p>
  </section>
  <section id="garden" class="card" hidden><div class="garden-head"><div><p class="eyebrow">あなたの なかまたち</p><h2>なかまの もり</h2></div><span id="total">0 / 18</span></div><div id="grid" class="grid"></div></section>
  <footer><span>この タブレットに じどうで きろくされます</span><span>さいこう <strong id="best">0</strong> れんぞく</span></footer>
</main>
<script>
const pals=[["あかリーフ","#ff665f","🌱"],["きいろポン","#f6c945","🌼"],["あおミント","#55aee8","💧"],["むらさきモコ","#9b72cf","🍇"],["しろフワ","#f7f2df","✨"],["ももハナ","#f58bb5","🌸"]];
let save={seeds:0,streak:0,best:0,friends:[0,0,0,0,0,0],answered:0};try{save={...save,...JSON.parse(localStorage.getItem("mori-no-sansu-v1")||"{}")}}catch(e){}
let problem,busy=false;const $=id=>document.getElementById(id);function store(){localStorage.setItem("mori-no-sansu-v1",JSON.stringify(save))}
function make(){let plus=Math.random()>.35,a,b;if(plus){a=1+Math.floor(Math.random()*10);b=Math.floor(Math.random()*(11-a));return{a,b,s:"+",ans:a+b}}a=Math.floor(Math.random()*11);b=Math.floor(Math.random()*(a+1));return{a,b,s:"−",ans:a-b}}
function renderProblem(){problem=make();$("a").textContent=problem.a;$("b").textContent=problem.b;$("sign").textContent=problem.s;let set=new Set([problem.ans]);while(set.size<3)set.add(Math.max(0,Math.min(10,problem.ans+Math.floor(Math.random()*7)-3)));$("answers").innerHTML=[...set].sort((x,y)=>x-y).map(n=>`<button aria-label="こたえ ${n}" data-n="${n}">${n}</button>`).join("");document.querySelectorAll("#answers button").forEach(b=>b.onclick=()=>answer(+b.dataset.n));busy=false}
function update(){ $("seeds").textContent=save.seeds;$("today").textContent=save.answered%5;$("progress").style.width=(save.answered%5)*20+"%";$("best").textContent=save.best;$("streak").textContent=save.streak>=2?"🔥 "+save.streak+"れんぞく せいかい！":"ゆっくり かんがえてね";$("needed").textContent=save.seeds%5?5-save.seeds%5:5;let total=save.friends.reduce((a,b)=>a+b,0);$("total").textContent=total+" / 18";$("grid").innerHTML=pals.map((p,i)=>{let l=save.friends[i],txt=!l?"タネを あつめよう":l===1?"めが でた！":l===2?"はっぱに せいちょう":"おはなが さいた！";return`<article class="pal ${l?"":"locked"}"><div class="face" style="--c:${p[1]}"><b>${l?p[2]:"?"}</b></div><h3>${l?p[0]:"？？？"}</h3><p>${txt}</p><div class="levels">${[1,2,3].map(n=>`<i class="${n<=l?"on":""}"></i>`).join("")}</div></article>`}).join("")}
function answer(n){if(busy)return;busy=true;let btn=[...document.querySelectorAll("#answers button")].find(b=>+b.dataset.n===n);if(n===problem.ans){save.seeds++;save.streak++;save.best=Math.max(save.best,save.streak);if(save.seeds%5===0){let i=save.friends.findIndex(x=>x<3);if(i>=0)save.friends[i]++}$("message").textContent=save.seeds%5===0?"やった！ なかまが そだったよ！":"せいかい！ タネを 1こ ゲット！";btn.classList.add("correct")}else{save.streak=0;$("message").textContent="おしい！ こたえは "+problem.ans;$("message").classList.add("wrong");btn.classList.add("wrong")}save.answered++;store();update();setTimeout(()=>{$("message").textContent="つぎも やってみよう！";$("message").classList.remove("wrong");renderProblem()},1200)}
$("playTab").onclick=()=>{$("play").hidden=false;$("garden").hidden=true;$("playTab").classList.add("active");$("gardenTab").classList.remove("active")};$("gardenTab").onclick=()=>{$("play").hidden=true;$("garden").hidden=false;$("gardenTab").classList.add("active");$("playTab").classList.remove("active");update()};update();renderProblem();
</script>
</body>
</html>
